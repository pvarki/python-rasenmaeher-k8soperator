# Local webhook CA + serving cert for Tilt. cert-manager owns Secret operator-tls.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: operator-selfsigned
  namespace: opendefence-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: operator-ca
  namespace: opendefence-system
spec:
  isCA: true
  commonName: opendefence-platform-ca
  secretName: operator-ca  # pragma: allowlist secret
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: operator-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: operator-ca
  namespace: opendefence-system
spec:
  ca:
    secretName: operator-ca  # pragma: allowlist secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: operator-tls
  namespace: opendefence-system
spec:
  secretName: operator-tls  # pragma: allowlist secret
  duration: 8760h
  renewBefore: 360h
  commonName: opendefence-platform.opendefence-system.svc
  dnsNames:
    - opendefence-platform
    - opendefence-platform.opendefence-system.svc
    - opendefence-platform.opendefence-system.svc.cluster.local
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: operator-ca
    kind: Issuer
