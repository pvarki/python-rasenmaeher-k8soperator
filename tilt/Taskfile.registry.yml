version: "3"

tasks:
  up:
    desc: Start the local container registry
    aliases: [u]
    cmds:
      - '"{{.RUNTIME}}" info > /dev/null'
      - task: create
      - '"{{.RUNTIME}}" start ctlptl-registry'

  create:
    internal: true
    status:
      - '"{{.RUNTIME}}" container inspect ctlptl-registry > /dev/null 2>&1'
    cmd: >-
      "{{.RUNTIME}}" run -d --restart=always
      -p 127.0.0.1:5005:5000 --name ctlptl-registry docker.io/library/registry:3

  down:
    desc: Stop and remove the local container registry
    aliases: [d]
    preconditions:
      - '"{{.RUNTIME}}" info > /dev/null'
    status:
      - '! "{{.RUNTIME}}" container inspect ctlptl-registry > /dev/null 2>&1'
    cmd: '"{{.RUNTIME}}" rm -f ctlptl-registry'
