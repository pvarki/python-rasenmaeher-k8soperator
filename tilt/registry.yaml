# Advertise the local registry to Tilt using the standard discovery ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-registry-hosting
  namespace: kube-public
data:
  localRegistryHosting.v1: |
    host: "localhost:5005"
    hostFromClusterNetwork: "rmk8soperator-registry:5000"
    help: "https://kind.sigs.k8s.io/docs/user/local-registry/"
