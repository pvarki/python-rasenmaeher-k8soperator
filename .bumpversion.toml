[tool.bumpversion]
current_version = "0.2.0+261003"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)\+(?P<release>\d+)'
serialize = ["{major}.{minor}.{patch}+{release}"]
commit = false
tag = false

[tool.bumpversion.parts.release]
calver_format = "{0Y}{0M}{0D}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.rst"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)-(?P<release>\d+)'
serialize = ["{major}.{minor}.{patch}-{release}"]
search = "rmk8soperator:{current_version}"
replace = "rmk8soperator:{new_version}"

[[tool.bumpversion.files]]
filename = "src/k8soperator/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/cli/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "tests/test_rmk8soperator.py"
search = '__version__ == "{current_version}"'
replace = '__version__ == "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''name = "rmk8soperator"
version = "{current_version}"'''
replace = '''name = "rmk8soperator"
version = "{new_version}"'''
