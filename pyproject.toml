[project]
name = "rmk8soperator"
version = "0.1.0"
description = "K8s Operator and CRDs with core RASENMAEHER entities"
authors = [{name="Eero af Heurlin", email="eero.afheurlin@iki.fi" }]
homepage = "https://github.com/pvarki/python-rasenmaeher-k8soperator"
repository = "https://github.com/pvarki/python-rasenmaeher-k8soperator"
license = "MIT"
readme = "README.rst"
requires-python = ">=3.12,<4.0"
dependencies = ["libadvian>=1.7,<2.0", "click>=8.1,<9.0"]

[project.scripts]
rmk8soperator = "rmk8soperator.console:rmk8soperator_cli"


[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["_build", "buck-out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PL"]
# Pylint's optional magic-value extension was not enabled previously.
ignore = ["PLR2004"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.12"

[tool.pytest.ini_options]
junit_family="xunit2"
addopts="--cov=rmk8soperator --cov-fail-under=65 --cov-branch"
asyncio_mode="strict"
asyncio_default_fixture_loop_scope="function"

[tool.coverage.run]
omit = ["tests/*"]
branch = true

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "coverage>=7.8,<8.0",
    "pytest-cov>=6.1,<7.0",
    "ruff>=0.12,<1.0",
    "bandit>=1.8,<2.0",
    "pyrefly>=1.3,<2.0",
    "prek>=0.2,<1.0",
    "pytest-asyncio>=1.4,<2.0",
    "bump-my-version>=1.0,<2.0",
    "detect-secrets>=1.5,<2.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmk8soperator"]
