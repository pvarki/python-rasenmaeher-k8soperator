version: "3"

includes:
  registry:
    taskfile: tilt/Taskfile.registry.yml
    dir: tilt
    aliases: [r]
  cluster:
    taskfile: tilt/Taskfile.cluster.yml
    dir: tilt
    aliases: [c]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  up:
    desc: Start the local registry, kind cluster, and Tilt
    aliases: [u]
    summary: |
      Starts the local registry, the kind cluster (kind-rmk8soperator),
      then Tilt in the foreground. Exit Tilt with Ctrl+C, then use task
      down to delete the cluster while leaving the registry running.
    cmds:
      - task: cluster:up
      - task: tilt:up

  down:
    desc: Delete the kind cluster
    aliases: [d]
    summary: |
      Deletes the kind cluster. The local registry is
      left running so the next task up can reuse it.
    cmds:
      - task: cluster:down

  clean:
    desc: Reset the kind cluster and local registry
    summary: |
      Deletes the kind cluster and removes the local registry. Exit Tilt
      with Ctrl+C first. Resources that are already gone are skipped.
    cmds:
      - task: down
      - task: registry:down

  tilt:up:
    desc: Start the Tilt development environment
    interactive: true
    aliases:
      - t:u
    cmds:
      - tilt up --context kind-rmk8soperator

  tilt:down:
    desc: Delete Tilt-managed resources from the development cluster
    aliases:
      - t:d
    cmd: tilt down --context kind-rmk8soperator
